name: Build Hugo site from push

on: 
  push:
    branches:
      - main
  # The nightly build is how live content reaches the site without a code change:
  # new blog posts (/blog, from Ghost), YouTube videos, and Hugging Face repos.
  # It runs an hour after refresh-feed-snapshots.yaml. Don't remove it.
  # workflow_dispatch allows a manual rebuild, e.g. right after publishing a post.
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

env:
  HUGO_SOURCE_DIR: "."
  HUGO_BASE_URL: ""
  HUGO_OUTPUT_DIR: "public"
  HUGO_PARAMS_GHOSTCONTENTKEY: ${{ secrets.HUGO_PARAMS_GHOSTCONTENTKEY }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps: 
      - uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Build site
        uses: omsf/static-site-tools/build/hugo@main
        with:
          base-url: ${{ env.HUGO_BASE_URL }}
          source-directory: ${{ env.HUGO_SOURCE_DIR }}
          output-directory: ${{ env.HUGO_OUTPUT_DIR }}

      - name: Make artifact
        shell: bash
        run: tar czf site.tar.gz -C ${{ env.HUGO_SOURCE_DIR }} ${{ env.HUGO_OUTPUT_DIR }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: site-build
          path: site.tar.gz
          if-no-files-found: error
          retention-days: 1
