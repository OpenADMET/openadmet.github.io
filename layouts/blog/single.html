{{/*
  Posts are read on Ghost (see content/blog/_content.gotmpl). This page only
  forwards the /blog/<slug>/ URLs we briefly hosted to the post on Ghost.
*/}}<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{{ .Title }} — OpenADMET</title>
    <link rel="canonical" href="{{ .Params.link }}">
    <meta name="robots" content="noindex">
    <meta http-equiv="refresh" content="0; url={{ .Params.link }}">
    <script>location.replace({{ .Params.link }});</script>
</head>
<body>
    <p>This post has moved to <a href="{{ .Params.link }}">{{ .Params.link }}</a>.</p>
</body>
</html>
