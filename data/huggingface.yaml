# Curated cards for /datasetsmodels/, pulled live from Hugging Face at build time
# (layouts/partials/feeds/huggingface.html).
#
# Each list sets the display order. Repos listed here use the title and lines
# given; any repo on huggingface.co/openadmet that isn't listed still appears,
# after these, newest first, with its title and summary taken from its card.
# Add `hide: true` to keep a repo off the site.

models:
