# Publications listed on /publications/, rendered by layouts/_default/publications.html.
#
# Each section has a `kind` (overview, structural, organizer or community) that feeds the
# summary counts at the top of the page. A paper that uses more than one dataset is listed
# in every relevant section; counts de-duplicate on `url`, so keep it identical across copies.
#
# Paper fields: title (HTML allowed), authors, type (label on the card), venue, url,
# link_text (optional, defaults to "View <type>"), data (optional), notes (optional, Markdown),
# extra_links (optional list of {text, url}).

updated: "October 2026"

sections:
