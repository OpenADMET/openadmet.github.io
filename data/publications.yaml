      - title: "Blind challenges let us see the path forward for predictive models"
        authors: "Chodera, Walters, Kosuri, Fraser"
        type: Publication
        venue: "J. Chem. Inf. Model. 2026, 66(4), 1947–1949"
        url: "https://doi.org/10.1021/acs.jcim.6c00205"
        notes: "Perspective on why blind challenges are essential for evaluating predictive models"
      - title: "OpenADMET: embracing the avoid-ome to transform drug discovery"
        authors: "Fraser, Edgar, Handly, Kosuri, Chodera, Murcko, Walters"
        type: Preprint
        venue: "Preprints.org, Dec 2025"
        url: "https://doi.org/10.20944/preprints202512.1202.v1"
        notes: "The case for OpenADMET and open data on the avoid-ome"
